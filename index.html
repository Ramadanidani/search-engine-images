<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A simple and modern image search engine."
    />

    <title>Image Search Engine</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header class="hero">
      <div class="hero-content">
        <span class="badge">IMAGE SEARCH</span>

        <h1>Find the <span>Perfect Image</span></h1>

        <p>Search and discover beautiful images from around the web.</p>

        <!-- Search -->
        <form id="search-form" class="search-form">
          <div class="search-input-wrapper">
            <span class="search-icon">⌕</span>

            <input
              type="text"
              id="search-box"
              placeholder="Search for images..."
              autocomplete="off"
              aria-label="Search for images"
            />

            <button type="submit" aria-label="Search">Search</button>
          </div>
        </form>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="section-header">
        <div>
          <h2>Search Results</h2>
          <p>Explore images based on your search.</p>
        </div>
      </div>

      <!-- Search Summary -->
      <div class="search-summary">
        <div class="search-summary-text">
          <span>Showing results for</span>
          <strong id="search-keyword"></strong>
        </div>

        <div class="search-summary-count">
          <strong id="result-count"></strong>
          <span>images found</span>
        </div>
      </div>

      <!-- Search Result -->
      <div id="search-result" class="search-result"></div>

      <!-- Show More -->
      <div class="show-more-container">
        <button id="show-more-btn" type="button">Show More</button>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>Image Search Engine &copy; 2023–2026</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
